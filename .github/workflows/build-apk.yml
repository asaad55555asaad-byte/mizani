name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apk-index.html", "icon.png", "capacitor.config.json", "package.json", ".github/workflows/build-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p www
          cp apk-index.html www/index.html
      - name: Bundle libraries for offline use
        run: |
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js -o www/xlsx.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o www/jspdf.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.js#' www/index.html
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: App icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("icon.png").convert("RGBA")
          for d,s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              p="android/app/src/main/res/mipmap-"+d+"/"
              r=im.resize((s,s),Image.LANCZOS)
              for n in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  r.save(p+n)
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Fixed signing key
        run: |
          mkdir -p ~/.android
          base64 -d debug.keystore.b64 > ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mizani-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
